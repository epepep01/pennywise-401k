name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 14 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Run unit tests
        run: npm test

      - name: Test deployment and rollback in isolation
        run: |
          docker build --file deploy/Dockerfile.tests --tag planner-deploy-tests .
          docker run --rm --network none planner-deploy-tests

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

  publish:
    name: Build and publish image
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image for the Droplet
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/epepep01/pennywise-401k:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/epepep01/pennywise-401k
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy planner
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://401kapp.duckdns.org
    permissions:
      contents: read
      packages: read
    concurrency:
      group: pennywise-401k-production
      cancel-in-progress: false
    steps:
      - name: Deploy immutable image over restricted SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          REVISION: ${{ github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          printf '%s\n%s\n%s\n' "$REVISION" "$IMAGE_DIGEST" "$REGISTRY_TOKEN" |
            ssh -T -F /dev/null -i "$ssh_dir/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "pennywise-deploy@$DEPLOY_HOST"
      - name: Check public website
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 https://401kapp.duckdns.org/ --output /dev/null
